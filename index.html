<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>1win Community Contest 🤘</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="bg-glow"></div>
<div class="bg-pattern"></div>

<header class="header">
  <div class="logo-group">
    <div class="brand-badge">1win</div>
    <div>
      <h1>1win Community 🤘</h1>
      <div class="subtitle">Конкурс стикеров & медиа в чате</div>
    </div>
  </div>
</header>

<main class="container">
  <section class="employee-box">
    <label for="employeeSelect">ВЫ КТО ТАКИЕ?</label>
    <div class="select-wrapper">
      <select id="employeeSelect">
        <option value="">Выбери свое имя из списка...</option>
      </select>
    </div>
    <div id="votesLeft" class="votes-counter"></div>
  </section>

  <section id="works" class="works-grid"></section>
</main>

<!-- Плавающий счетчик -->
<div id="stickyCounter" class="sticky-counter">
  <span id="stickyCounterText">Осталось голосов: 10</span>
  <span id="voteAnimBadge" class="vote-anim-badge"></span>
</div>

<!-- Поп-ап 1: Победители -->
<div id="modalOverlay" class="modal-overlay">
  <div class="modal-card">
    <button type="button" class="modal-close" id="modalClose">&times;</button>
    <div class="modal-header">
      <div class="trophy-wrapper">
        <img src="trophy.png" alt="Trophy" class="trophy-img">
      </div>
      <h2 class="modal-title">А вот и победители!</h2>
      <div class="modal-subtitle">
        (Блен, снова не из Индии 😭)
      </div>
    </div>
    <div id="winnersList" class="winners-list"></div>
  </div>
</div>

<!-- Поп-ап 2: Промежуточный мемный с интерактивным сюжетом -->
<div id="waitModalOverlay" class="modal-overlay">
  <div class="modal-card wait-card" id="waitCardBox">
    <button type="button" class="modal-close" id="waitModalClose">&times;</button>
    <div class="wait-content">
      <h2 class="wait-title" id="waitTitle">Твой голос учтен!</h2>
      <p class="wait-text" id="waitText">
        Чья-то нервная система уже готовится к хейту в чате.<br>
        Да прибудет с вами сила 🫡
      </p>

      <div class="heal-hint-box" id="healHintBox">
        <span class="hint-text">Нажми три раза, если хочешь помочь девочкам захиллиться 💅</span>
        <span class="hint-arrow">👇</span>
      </div>

      <div class="wait-img-wrapper" id="healImgBox">
        <div class="flash-overlay" id="flashOverlay"></div>
        <div class="explosion-overlay" id="explosionOverlay"></div>
        <img src="hate2.jpg" alt="Meme" class="wait-img" id="memeImage">
        <div class="hearts-container" id="heartsContainer"></div>
      </div>

      <!-- Стопка карточек в стиле игры UNO -->
      <div class="uno-stack-container" id="ronaldoGrid" style="display: none;">
        <div class="uno-card" style="--i: 4;"><img src="photo_2026-06-21_17-51-53.jpg" alt="Art 1" class="ronaldo-img"></div>
        <div class="uno-card" style="--i: 3;"><img src="photo_2026-06-21_20-17-40.jpg" alt="Art 2" class="ronaldo-img"></div>
        <div class="uno-card" style="--i: 2;"><img src="photo_2026-07-11_14-37-45.jpg" alt="Art 3" class="ronaldo-img"></div>
        <div class="uno-card" style="--i: 1;"><img src="photo_2026-07-24_22-20-43.jpg" alt="Art 4" class="ronaldo-img"></div>
        <div class="uno-card" style="--i: 0;"><img src="photo_2026-07-11_21-31-52.jpg" alt="Art 5" class="ronaldo-img"></div>
      </div>
    </div>
  </div>
</div>

<!-- Уведомление о копировании -->
<div id="toast" class="toast">Скопировано!</div>

<script src="script.js?v=13"></script>
</body>
</html>
