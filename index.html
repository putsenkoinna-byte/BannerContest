<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>1win Community </title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="bg-glow"></div>
<div class="bg-pattern"></div>

<header class="header">
  <div class="logo-group">
    <div class="brand-badge">1win</div>
    <div>
      <h1>1win Community 🤘</h1>
      <div class="subtitle">Конкурс стикеров & медиа в чате</div>
    </div>
  </div>
</header>

<main class="container">
  <section class="employee-box">
    <label for="employeeSelect">Кто сейчас голосует?</label>
    <div class="select-wrapper">
      <select id="employeeSelect">
        <option value="">Выберите свое имя из списка...</option>
      </select>
    </div>
    <div id="votesLeft" class="votes-counter">Выберите имя, чтобы начать голосование</div>
  </section>

  <section id="works" class="works-grid"></section>
</main>

<!-- Плавающий счетчик (Осталось голосов) -->
<div id="stickyCounter" class="sticky-counter">
  <span id="stickyCounterText">Осталось голосов: 10</span>
  <span id="voteAnimBadge" class="vote-anim-badge"></span>
</div>

<!-- Поп-ап 1: Победители -->
<div id="modalOverlay" class="modal-overlay">
  <div class="modal-card">
    <button type="button" class="modal-close" id="modalClose">&times;</button>
    <div class="modal-header">
      <div class="trophy-wrapper">
        <img src="trophy.png" alt="Trophy" class="trophy-img">
      </div>
      <h2 class="modal-title">А вот и победители!</h2>
      <div class="modal-subtitle">
        (Блен, снова не из Индии 😭)
      </div>
    </div>
    <div id="winnersList" class="winners-list"></div>
  </div>
</div>

<!-- Поп-ап 2: Промежуточный мемный -->
<div id="waitModalOverlay" class="modal-overlay">
  <div class="modal-card wait-card">
    <button type="button" class="modal-close" id="waitModalClose">&times;</button>
    <div class="wait-content">
      <div class="wait-img-wrapper">
        <img src="hate.jpg" alt="Meme" class="wait-img">
      </div>
      <h2 class="wait-title">Ваш голос учтен!</h2>
      <p class="wait-text">
        Чья-то нервная система уже готовится к хейту в чате.<br>
        Да прибудет с вами сила 🫡
      </p>
    </div>
  </div>
</div>

<!-- Уведомление о копировании -->
<div id="toast" class="toast">Скопировано!</div>

<script src="script.js"></script>
</body>
</html>
